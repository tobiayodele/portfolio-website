<div class="mb-4 flex flex-col items-center gap-3">
  {{ range hugo.Data.social }}
  <a
    class="flex items-center gap-3 text-lg"
    href="{{ .url }}"
    target="_blank"
    rel="noopener noreferrer"
  >
    <i class="{{ .icon }}"></i>
    <span class = "ml-3">{{ .title }}</span>
  </a>
  {{ end }}
</div>
